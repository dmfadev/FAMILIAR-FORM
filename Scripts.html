<script>
// ══════════════════════════════════════════════════════════════
//  SCRIPTS.HTML — Lógica del cliente
// ══════════════════════════════════════════════════════════════

// ── ESTADO GLOBAL ─────────────────────────────────────────────
const S = {
  locales:          [],
  materialesA:      [],
  materialesB:      [],
  localSeleccionado: null,
  tipoMaterial:     null,   // 'A' | 'B' | null
  fotos:            [],     // [{dataUrl, nombre}]
  enviando:         false,
};

// ── INIT ──────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  mostrarOverlay('Cargando datos de la planilla...');
  google.script.run
    .withSuccessHandler(inicializar)
    .withFailureHandler(err => {
      ocultarOverlay();
      toast('Error al cargar: ' + err.message, 'error');
    })
    .getDatosIniciales();
});

function inicializar(data) {
  ocultarOverlay();
  if (!data.ok) { toast('Error: ' + data.error, 'error'); return; }

  S.locales    = data.locales    || [];
  S.materialesA = data.materialesA || [];
  S.materialesB = data.materialesB || [];

  poblarSelect('sel-fiscalizador', data.fiscalizadores, '— Seleccionar Fiscalizador —');
  poblarSelect('sel-beneficio',    data.beneficios,     '— Seleccionar Beneficio —');
  poblarSelect('sel-tipo-oferta',  data.tiposOferta,    '— Seleccionar Tipo de Oferta —');
  poblarSelect('sel-estado',       data.estadoVisual,   '— Seleccionar Estado Visual —');

  // Fecha por defecto = hoy
  document.getElementById('fecha-encuesta').valueAsDate = new Date();

  initBuscador();
  initBotonesRadio();
  initFotos();
  initSelectListeners();
  actualizarBoton();
}

// ── POBLAR SELECT ─────────────────────────────────────────────
function poblarSelect(id, lista, placeholder) {
  const sel = document.getElementById(id);
  sel.innerHTML = '<option value="" disabled selected>' + placeholder + '</option>';
  (lista || []).forEach(v => {
    const o = document.createElement('option');
    o.value = o.textContent = v;
    sel.appendChild(o);
  });
}

// ── BUSCADOR DE LOCALES ───────────────────────────────────────
function initBuscador() {
  const input    = document.getElementById('buscar-local');
  const dropdown = document.getElementById('dropdown-locales');
  const badge    = document.getElementById('local-badge');

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    dropdown.innerHTML = '';
    if (!q) { dropdown.classList.remove('open'); return; }

    const hits = S.locales.filter(l => l.toLowerCase().includes(q)).slice(0, 25);

    if (!hits.length) {
      dropdown.innerHTML = '<div class="dropdown-empty">Sin coincidencias</div>';
    } else {
      hits.forEach(local => {
        const d = document.createElement('div');
        d.className = 'dropdown-item';
        // Resaltar coincidencia
        const idx = local.toLowerCase().indexOf(q);
        d.innerHTML = local.slice(0, idx)
          + '<strong>' + local.slice(idx, idx + q.length) + '</strong>'
          + local.slice(idx + q.length);
        d.addEventListener('click', () => elegirLocal(local));
        dropdown.appendChild(d);
      });
    }
    dropdown.classList.add('open');
  });

  // Cerrar al hacer click afuera
  document.addEventListener('click', e => {
    if (!document.getElementById('campo-local').contains(e.target))
      dropdown.classList.remove('open');
  });

  // Botón limpiar local
  document.getElementById('clear-local').addEventListener('click', () => {
    S.localSeleccionado = null;
    badge.classList.remove('show');
    input.value = '';
    actualizarBoton();
  });

  function elegirLocal(local) {
    S.localSeleccionado = local;
    input.value = '';
    dropdown.classList.remove('open');
    document.getElementById('badge-txt').textContent = local;
    badge.classList.add('show');
    actualizarBoton();
  }
}

// ── BOTONES RADIO ─────────────────────────────────────────────
function initBotonesRadio() {

  // ¿Tiene materiales? (Sí / No / Parcial)
  document.querySelectorAll('[data-mat]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-mat]').forEach(b =>
        b.classList.remove('active-yes','active-no','active-par')
      );
      const v = btn.dataset.mat;
      if (v === 'Sí')      btn.classList.add('active-yes');
      else if (v === 'No') btn.classList.add('active-no');
      else                 btn.classList.add('active-par');

      const tieneMat = v === 'Sí' || v === 'Parcial';
      document.getElementById('sec-materiales').classList.toggle('visible', tieneMat);
      if (!tieneMat) {
        S.tipoMaterial = null;
        document.querySelectorAll('[data-tipo]').forEach(b =>
          b.classList.remove('active-tipo')
        );
        document.getElementById('sec-chk-A').classList.remove('visible');
        document.getElementById('sec-chk-B').classList.remove('visible');
      }
      actualizarBoton();
    });
  });

  // Tipo A / Tipo B
  document.querySelectorAll('[data-tipo]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-tipo]').forEach(b =>
        b.classList.remove('active-tipo')
      );
      btn.classList.add('active-tipo');
      S.tipoMaterial = btn.dataset.tipo;
      renderCheckboxes();
    });
  });
}

function renderCheckboxes() {
  const secA = document.getElementById('sec-chk-A');
  const secB = document.getElementById('sec-chk-B');
  secA.classList.toggle('visible', S.tipoMaterial === 'A');
  secB.classList.toggle('visible', S.tipoMaterial === 'B');
  if (S.tipoMaterial === 'A') buildChk('chk-A', S.materialesA);
  if (S.tipoMaterial === 'B') buildChk('chk-B', S.materialesB);
}

function buildChk(containerId, lista) {
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = '';
  lista.forEach((item, i) => {
    const id  = containerId + '_' + i;
    const lbl = document.createElement('label');
    lbl.className = 'chk-label';
    lbl.innerHTML = '<input type="checkbox" id="' + id + '" value="' + item + '"> ' + item;
    wrap.appendChild(lbl);
  });
}

function getMateriales() {
  if (!S.tipoMaterial) return [];
  const wrap = document.getElementById('chk-' + S.tipoMaterial);
  if (!wrap) return [];
  return [...wrap.querySelectorAll('input:checked')].map(c => c.value);
}

function getTieneMateriales() {
  const btn = document.querySelector('[data-mat].active-yes, [data-mat].active-no, [data-mat].active-par');
  return btn ? btn.dataset.mat : '';
}

// ── MÓDULO DE FOTOS ───────────────────────────────────────────
function initFotos() {
  const input = document.getElementById('input-fotos');
  input.addEventListener('change', e => procesarArchivos(e.target.files));

  const zona = document.getElementById('foto-zona');
  zona.addEventListener('dragover',  e => { e.preventDefault(); zona.classList.add('dragover'); });
  zona.addEventListener('dragleave', () => zona.classList.remove('dragover'));
  zona.addEventListener('drop', e => {
    e.preventDefault();
    zona.classList.remove('dragover');
    procesarArchivos(e.dataTransfer.files);
  });
}

function procesarArchivos(files) {
  const libre = 6 - S.fotos.length;
  if (libre <= 0) { toast('Máximo 6 fotos', 'warn'); return; }
  [...files].slice(0, libre).forEach(f => {
    if (f.type.startsWith('image/')) procesarFoto(f);
  });
}

function procesarFoto(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      // Redimensionar a 1920px lado largo
      const MAX = 1920;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
        else        { w = Math.round(w * MAX / h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.88);
      S.fotos.push({ dataUrl, nombre: nombreFoto(S.fotos.length + 1) });
      renderThumbs();
      actualizarContador();
      actualizarBoton();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function nombreFoto(n) {
  const loc  = (S.localSeleccionado || 'LOCAL').replace(/[^A-Z0-9]/gi,'_').toUpperCase();
  const fisc = (getSelect('sel-fiscalizador') || 'FISC').replace(/\s+/g,'_').toUpperCase();
  const d    = new Date();
  const fecha = d.getFullYear()
    + String(d.getMonth()+1).padStart(2,'0')
    + String(d.getDate()).padStart(2,'0');
  return loc + '_' + fisc + '_' + fecha + '_' + String(n).padStart(2,'0') + '.jpg';
}

function renderThumbs() {
  const grid = document.getElementById('fotos-grid');
  grid.innerHTML = '';
  S.fotos.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'foto-thumb';
    div.innerHTML =
      '<img src="' + f.dataUrl + '" alt="Foto ' + (i+1) + '">' +
      '<span class="foto-num">' + (i+1) + '</span>' +
      '<button class="foto-del" title="Eliminar" onclick="eliminarFoto(' + i + ')">✕</button>';
    grid.appendChild(div);
  });
}

function eliminarFoto(i) {
  S.fotos.splice(i, 1);
  renderThumbs();
  actualizarContador();
  actualizarBoton();
}

function actualizarContador() {
  const n   = S.fotos.length;
  const el  = document.getElementById('foto-counter');
  const bar = document.getElementById('progress-fill');
  bar.style.width = Math.round(n / 6 * 100) + '%';
  if (n === 0) {
    el.className = 'foto-counter warn';
    el.textContent = 'Sin fotos · Se requieren al menos 2';
  } else if (n < 2) {
    el.className = 'foto-counter warn';
    el.textContent = n + '/6 foto · Falta ' + (2 - n) + ' más';
  } else {
    el.className = 'foto-counter ok';
    el.textContent = n + '/6 fotos ✓';
  }
}

// ── VALIDACIÓN & ENVÍO ────────────────────────────────────────
function initSelectListeners() {
  ['sel-fiscalizador','sel-beneficio','sel-tipo-oferta','sel-estado']
    .forEach(id => document.getElementById(id)?.addEventListener('change', actualizarBoton));
  document.getElementById('fecha-encuesta')?.addEventListener('change', actualizarBoton);
}

function actualizarBoton() {
  const ok =
    S.localSeleccionado &&
    getSelect('sel-fiscalizador') &&
    getSelect('sel-beneficio') &&
    getSelect('sel-tipo-oferta') &&
    getSelect('sel-estado') &&
    getTieneMateriales() &&
    document.getElementById('fecha-encuesta')?.value &&
    S.fotos.length >= 2;

  document.getElementById('btn-enviar').disabled = !ok;
}

function getSelect(id) {
  return document.getElementById(id)?.value || '';
}

// ── ENVIAR ────────────────────────────────────────────────────
function enviarFormulario() {
  if (S.enviando) return;
  S.enviando = true;

  const btn = document.getElementById('btn-enviar');
  btn.disabled = true;
  btn.querySelector('.spinner').style.display = 'inline-block';
  btn.querySelector('.lbl').textContent = 'Enviando...';

  mostrarOverlay(
    'Subiendo ' + S.fotos.length + ' foto(s)...',
    'Esto puede tomar unos segundos'
  );

  const payload = {
    fiscalizador:       getSelect('sel-fiscalizador'),
    fechaEncuesta:      document.getElementById('fecha-encuesta').value,
    local:              S.localSeleccionado,
    tieneMateriales:    getTieneMateriales(),
    beneficio:          getSelect('sel-beneficio'),
    tipoOferta:         getSelect('sel-tipo-oferta'),
    tipoMaterial:       S.tipoMaterial ? 'Tipo ' + S.tipoMaterial : '',
    materialesColocados: getMateriales(),
    estadoVisual:       getSelect('sel-estado'),
    observaciones:      document.getElementById('observaciones').value.trim(),
    fotos: S.fotos.map(f => ({ base64: f.dataUrl, nombre: f.nombre })),
  };

  google.script.run
    .withSuccessHandler(onExito)
    .withFailureHandler(onError)
    .guardarRegistro(payload);
}

function onExito(res) {
  ocultarOverlay();
  S.enviando = false;
  resetBtn();
  if (res.ok) {
    toast('✅ Registro guardado — fila ' + res.fila, 'success');
    resetFormulario();
  } else {
    toast('❌ ' + res.error, 'error');
    actualizarBoton();
  }
}

function onError(err) {
  ocultarOverlay();
  S.enviando = false;
  resetBtn();
  toast('❌ Error: ' + err.message, 'error');
  actualizarBoton();
}

function resetBtn() {
  const btn = document.getElementById('btn-enviar');
  btn.querySelector('.spinner').style.display = 'none';
  btn.querySelector('.lbl').textContent = 'Enviar Fiscalización';
}

function resetFormulario() {
  ['sel-fiscalizador','sel-beneficio','sel-tipo-oferta','sel-estado']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('fecha-encuesta').valueAsDate = new Date();
  document.getElementById('observaciones').value = '';
  document.getElementById('buscar-local').value = '';
  document.getElementById('local-badge').classList.remove('show');
  document.querySelectorAll('[data-mat],[data-tipo]').forEach(b =>
    b.classList.remove('active-yes','active-no','active-par','active-tipo')
  );
  document.getElementById('sec-materiales').classList.remove('visible');
  document.getElementById('sec-chk-A').classList.remove('visible');
  document.getElementById('sec-chk-B').classList.remove('visible');
  S.localSeleccionado = null;
  S.tipoMaterial = null;
  S.fotos = [];
  S.enviando = false;
  renderThumbs();
  actualizarContador();
  actualizarBoton();
}

// ── UI HELPERS ────────────────────────────────────────────────
function mostrarOverlay(msg, sub) {
  document.getElementById('overlay-msg').textContent = msg || 'Procesando...';
  document.getElementById('overlay-sub').textContent = sub || '';
  document.getElementById('overlay').classList.add('show');
}
function ocultarOverlay() {
  document.getElementById('overlay').classList.remove('show');
}

let _toastTimer;
function toast(msg, tipo) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (tipo || 'success');
  clearTimeout(_toastTimer);
  requestAnimationFrame(() => el.classList.add('show'));
  _toastTimer = setTimeout(() => el.classList.remove('show'), 4800);
}
</script>
